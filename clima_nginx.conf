# ==============================================================================
# Clima Criminal - Configuración Nginx para Producción
# Subdominio: clima.ramirezsoft.com
# ==============================================================================

server {
    server_name clima.ramirezsoft.com;

    access_log /var/log/nginx/clima_ramirezsoft_access.log;
    error_log /var/log/nginx/clima_ramirezsoft_error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
